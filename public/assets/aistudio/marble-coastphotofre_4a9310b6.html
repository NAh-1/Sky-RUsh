<html lang="en"><head><meta charset="utf-8"><title>Marble Coast</title>

@keyframes pp{0%{opacity:1;transform:scale(1.6)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85)}}

#flash.pop{animation:fl2 .5s ease-out}
@keyframes fl2{0%{opacity:.95}100%{opacity:0}}

.s-attract #title,.s-attract #prompt{display:block}

const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
async function initCam(){
 try{vid.srcObject=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'},audio:false});vid.muted=true;vid.playsInline=true;await vid.play();camOK=true}catch(e){note('NO CAMERA - USE KEYBOARD')}
 try{const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',mp=await import(V+'/+esm'),fs=await mp.FilesetResolver.forVisionTasks(V+'/wasm');
  const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',delegate:d},runningMode:'VIDEO',numPoses:1});
  try{pose=await mp.PoseLandmarker.createFromOptions(fs,o('GPU'))}catch(e){pose=await mp.PoseLandmarker.createFromOptions(fs,o('CPU'))}}catch(e){note('POSE MODEL FAILED - USE KEYBOARD')}}
function handle(lm,t){
 const ls=lm[11],rs=lm[12];if(!(ls.visibility>.5&&rs.visibility>.5))return;
 const sw=Math.abs(ls.x-rs.x)+.001,smx=(ls.x+rs.x)/2;
 if(t-pz.seen>.6||Math.abs(smx-pz.ax)>.06){pz.ax=smx;pz.hold=t}
 pz.seen=t;
 let r=(.5-smx)*2.2+((rs.y-ls.y)/sw)*1.2;const lh=lm[23],rh=lm[24];
 if(lh.visibility>.4&&rh.visibility>.4)r+=-((smx-(lh.x+rh.x)/2)/sw)*1.4;
 pz.raw+=(r-pz.raw)*.5;
 let pr=0;for(const i of[15,16]){const w=lm[i];if(w.visibility>.3){if(pz.wy[i]!=null)pr+=Math.abs(w.y-pz.wy[i]);pz.wy[i]=w.y}else pz.wy[i]=null}
 const dt=Math.max(.016,t-pz.t);pz.t=t;pz.pump=pz.pump*.7+(pr/dt/sw)*.3}
function poseStep(){
 if(!camOK||vid.readyState<2){cx.fillStyle='#001a2e';cx.fillRect(0,0,320,240);return}
 cx.drawImage(vid,0,0,320,240);cx.save();cx.setTransform(-1,0,0,1,320,0);cx.drawImage(vid,0,0,320,240);cx.restore();
 if(pose&&vid.currentTime!==lastVT){lastVT=vid.currentTime;try{const r=pose.detectForVideo(vid,performance.now());lastLM=r.landmarks&&r.landmarks[0];if(lastLM){lastLMt=now;handle(lastLM,now)}}catch(e){}}
 if(lastLM&&now-lastLMt<.4){cx.shadowColor='#0ff';cx.shadowBlur=10;cx.strokeStyle='#27f6ff';cx.lineWidth=4;cx.lineCap='round';
  for(const[a,b]of BONES){const p=lastLM[a],q=lastLM[b];if(p.visibility<.4||q.visibility<.4)continue;cx.beginPath();cx.moveTo((1-p.x)*320,p.y*240);cx.lineTo((1-q.x)*320,q.y*240);cx.stroke()}
  cx.fillStyle='#ff4df0';for(const i of[11,12,13,14,15,16,23,24]){const p=lastLM[i];if(p.visibility<.4)continue;cx.beginPath();cx.arc((1-p.x)*320,p.y*240,5,0,7);cx.fill()}cx.shadowBlur=0}}
const present=()=>now-pz.seen<.6;

/* ---------- GAME STATE ---------- */
const newG=()=>({s:0,u:0,uv:0,v:0,h:0,vy:0,cp:0,t:0,on:0,steady:0,nitro:0,nitroOn:0,pad:0,fall:0,fallT:0,kb:0,steer:0,finT:0,celeT:0,base:0});
let G=newG(),st='attract',sT=0,lastSeen=now,armed=true,absentT=0,cn=-1,fT_=0,board=[],rank=0,spN=0,camFov=62,absentFrom=0;
const keys={},cls={attract:'s-attract',count:'s-count',race:'s-race',cele:'s-race',finish:'s-finish'};
function setState(s){st=s;sT=0;document.body.className=cls[s]}
let phPhase=null,phT=0,phLast=0,pName='PLAYER',meIdx=-1;
function loadB(){try{const b=JSON.parse(localStorage.getItem('marbleRushTop10'));if(Array.isArray(b))return b.slice(0,10)}catch(e){}return[]}
function saveB(){try{localStorage.setItem('marbleRushTop10',JSON.stringify(board))}catch(e){}}
function toAttract(arm){phPhase=null;G=newG();archColors(0);$('modal').style.display='';lastSeen=now;pz.hold=null;armed=arm;absentT=0;cn=-1;setState('attract');$('prompt').textContent='STEP IN FRONT OF CAMERA TO PLAY'}
function startCount(){if(st!=='attract')return;G=newG();archColors(0);lastSeen=now;setState('count');cn=-1}
function pop(el,txt){el.textContent=txt;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}

/* ---------- FINISH / LEADERBOARD ---------- */
function showModal(){
 setState('finish');fT_=0;board=loadB();const t=G.finT;rank=board.filter(e=>e.t<t).length+1;
 $('ft').textContent=fmt(t);$('rk').textContent=rank<=10?'RANK #'+rank:'NOT IN THE TOP 10 THIS TIME';
 pName='PLAYER';meIdx=-1;if(rank<=10){$('card').className='m-rec';$('nm').value='';setTimeout(()=>$('nm').focus(),50)}else askPhoto()}
function showBoard(me){
 $('card').className='m-bd';$('lb').innerHTML=Array.from({length:10},(_,i)=>{const e=board[i];return e?`<li class="${i===me?'me':''}"><span>${i+1}</span><span>${e.n.replace(/</g,'')}</span><span>${fmt(e.t)}</span></li>`:`<li class="em"><span>${i+1}</span><span>---</span><span>--:--.--</span></li>`}).join('');fT_=0}
function submit(){if(st!=='finish'||$('card').className!=='m-rec')return;const n=$('nm').value.trim()||'PLAYER';board.splice(rank-1,0,{n,t:G.finT});board=board.slice(0,10);saveB();pName=n;meIdx=rank-1;askPhoto()}
function askPhoto(){if(!camOK){showBoard(meIdx);return}$('card').className='m-ph';fT_=0}
function startSnap(){phPhase='sn';phT=0;phLast=0;fT_=0;$('card').className='m-sn'}
function drawPhoto(num){
 const c=$('phc'),g=c.getContext('2d'),Wd=1080,H=1350,FN="Impact,'Arial Black',sans-serif";
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#071b4d');gr.addColorStop(.5,'#0a5fd0');gr.addColorStop(1,'#00c8ff');g.fillStyle=gr;g.fillRect(0,0,Wd,H);
 g.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<22;i++){g.beginPath();g.arc((i*197)%Wd,(i*311)%H,30+(i*37)%70,0,7);g.fill()}
 g.textAlign='center';g.lineJoin='round';
 g.font='150px '+FN;g.lineWidth=18;g.strokeStyle='#0a2a66';g.strokeText('MARBLE RUSH',540,170);g.fillStyle='#ffd400';g.fillText('MARBLE RUSH',540,170);
 g.fillStyle='#00e5ff';g.beginPath();g.roundRect(290,205,500,80,40);g.fill();g.fillStyle='#04243d';g.font='56px '+FN;g.fillText('SIS CARNIVAL',540,264);
 const x=90,y=330,w=900,h=700;
 g.save();g.shadowColor='#00e5ff';g.shadowBlur=40;g.fillStyle='#fff';g.beginPath();g.roundRect(x-14,y-14,w+28,h+28,44);g.fill();g.restore();
 g.save();g.beginPath();g.roundRect(x,y,w,h,32);g.clip();
 if(camOK&&vid.readyState>=2){const vw=vid.videoWidth||640,vh=vid.videoHeight||480,k=Math.max(w/vw,h/vh),dw=vw*k,dh=vh*k;g.translate(x+w/2,y+h/2);g.scale(-1,1);g.drawImage(vid,-dw/2,-dh/2,dw,dh)}else{g.fillStyle='#012';g.fillRect(x,y,w,h)}
 g.restore();
 if(rank<=10){g.fillStyle='#ffd400';g.beginPath();g.roundRect(x+24,y+h-116,360,90,45);g.fill();g.fillStyle='#2a1a00';g.font='56px '+FN;g.fillText('TOP 10 \u2022 #'+rank,x+204,y+h-52)}
 if(num>0){g.font='400px '+FN;g.lineWidth=22;g.strokeStyle='#0a2a66';g.fillStyle='#fff';g.strokeText(num,540,y+h/2+140);g.fillText(num,540,y+h/2+140)}
 g.font='100px '+FN;g.lineWidth=14;g.strokeStyle='#0a2a66';g.strokeText(pName,540,1135);g.fillStyle='#fff';g.fillText(pName,540,1135);
 g.font='44px '+FN;g.fillStyle='#9ff';g.fillText('FINAL TIME',540,1186);
 g.font='130px '+FN;g.fillStyle='#ffd400';g.fillText(fmt(G.finT),540,1296);
 g.font='30px '+FN;g.fillStyle='rgba(255,255,255,.7)';g.fillText('#MarbleRush  #SISCarnival',540,1335)}
{const kb=$('kb');'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').concat(['\u232B']).forEach(ch=>{const b=document.createElement('button');b.textContent=ch;b.onmousedown=e=>e.preventDefault();
 b.onclick=()=>{fT_=0;const n=$('nm');if(ch==='\u232B')n.value=n.value.slice(0,-1);else if(n.value.length<10)n.value+=ch};kb.appendChild(b)})}
$('nm').oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9 ]/g,'');fT_=0};
$('sub').onclick=submit;$('again').onclick=()=>toAttract(true);
$('phyes').onclick=startSnap;$('phre').onclick=startSnap;$('phno').onclick=$('phdn').onclick=()=>showBoard(meIdx);
$('phdl').onclick=()=>{fT_=0;const a=document.createElement('a');a.href=$('phc').toDataURL('image/png');a.download='marble-rush-'+pName.toLowerCase().replace(/\s+/g,'-')+'.png';a.click()};

/* ---------- INPUT ---------- */
function fs(){const e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen().catch(()=>{})}
$('fs').onclick=e=>{e.stopPropagation();fs();A.init()};
addEventListener('click',()=>{A.init();if(st==='attract')fs()});
addEventListener('keydown',e=>{if(e.target.id==='nm'){fT_=0;if(e.key==='Enter')submit();return}
 keys[e.code]=true;lastSeen=now;A.init();if(e.code==='KeyF')fs();
 if(st==='attract'&&(e.code==='Space'||e.code==='Enter'))startCount();
 if(e.code==='Space'||e.code.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.code]=false});

/* ---------- GAME LOOP ---------- */
const q=new THREE.Quaternion(),mPos=new THREE.Vector3(),cPos=new THREE.Vector3();
function physics(dt){
 const race=st==='race';
 if(race){G.t+=dt;if(present())lastSeen=now}
 G.kb+=(((keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0))-G.kb)*Math.min(1,dt*8);
 let ps=present()?(pz.raw-G.base)*1.3:0;if(Math.abs(ps)<.06)ps=0;const steer=clamp(ps+G.kb,-1,1);G.steer+=(steer-G.steer)*Math.min(1,dt*10);
 // nitro
 if(race&&!G.fall){if(G.nitroOn>0){G.nitroOn-=dt;G.nitro=Math.max(0,G.nitroOn/3)}
  else{let f=Math.max(0,pz.pump-1.5)*.12;if(keys.Space)f+=.8;G.nitro=Math.min(1,G.nitro+f*dt);if(G.nitro>=1){G.nitroOn=3;A.whoosh()}}}
 else if(!race){G.nitroOn=0;G.nitro=0}
 if(Math.abs(steer)<.2&&!G.fall)G.steady+=dt;else G.steady=Math.max(0,G.steady-dt*2);
 const stF=clamp((G.steady-2)/2,0,1);
 if(!G.fall)G.on+=dt;
 const base=28*(1+.12*G.cp),acc=1+.5*(1-Math.exp(-G.on/30));
 let tgt=race&&!G.fall?base*acc*(1+.2*stF)*(G.nitroOn>0?1.7:1)*(G.pad>0?1.35:1):0;
 if(!race&&!G.fall)tgt=0;
 G.v+=(tgt-G.v)*Math.min(1,dt*(tgt>G.v?2.2:(race?4:1.2)));
 G.pad-=dt;
 // lateral
 frame(G.s);const drift=clamp(fC*G.v*G.v*.1,-6,6);
 G.uv+=((G.fall?G.uv:steer*14+drift)-G.uv)*Math.min(1,dt*6);G.u+=G.uv*dt;
 G.s=Math.min(L,G.s+G.v*dt);
 // hop
 G.vy-=26*dt;G.h+=G.vy*dt;if(G.h<=0&&!G.fall){G.h=0;G.vy=0}
 if(race){
  if(!G.fall){
   if(Math.abs(G.u)>W+.3){G.fall=1;G.fallT=0;G.vy=0;G.nitroOn=0;G.nitro=0;A.fall()}
   for(const p of pads)if(G.pad<=0&&Math.abs(G.s-p.s)<3.5&&Math.abs(G.u-p.u)<2.3){G.pad=2;A.sw(500,3000,.5,.3)}
   for(const r of ramps)if(G.h<=.01&&Math.abs(G.s-r.s)<2.5&&Math.abs(G.u-r.u)<3){G.vy=11;G.h=.05}
   if(G.cp<10&&G.s>=cpS[G.cp]){G.cp++;arches[G.cp-1].material.color.set(0x6bff6b);A.chime();
    if(G.cp===10){G.finT=G.t;G.celeT=0;setState('cele');A.fanfare();for(let i=0;i<350;i++){const a=Math.random()*6.28,sp=5+Math.random()*20;conf.spawn(mPos.x,mPos.y+3,mPos.z,Math.cos(a)*sp,10+Math.random()*25,Math.sin(a)*sp,5,Math.random(),Math.random(),Math.random()+.3)}}
    else pop($('banner'),'CHECKPOINT '+G.cp+' \u2022 +12% SPEED')}
  }else{G.fallT+=dt;if(G.fallT>=2){G.fall=0;G.s=G.cp>0?cpS[G.cp-1]:0;G.u=0;G.uv=0;G.v=0;G.on=0;G.steady=0;G.h=0;G.vy=0}}
 }
 if(st==='cele'){G.celeT+=dt;if(G.celeT<3)for(let i=0;i<8;i++)conf.spawn(mPos.x+(Math.random()-.5)*30,mPos.y+18,mPos.z+(Math.random()-.5)*30,(Math.random()-.5)*8,-4,(Math.random()-.5)*8,5,Math.random(),Math.random(),Math.random()+.3);if(G.celeT>3.2)showModal()}
 if(race&&G.nitroOn>0){for(let i=0;i<4;i++)fire.spawn(mPos.x-fT.x*1.3,mPos.y-.2,mPos.z-fT.z*1.3,-fT.x*(8+Math.random()*6)+(Math.random()-.5)*4,(Math.random()-.3)*4,-fT.z*(8+Math.random()*6)+(Math.random()-.5)*4,.55,1,.35+Math.random()*.5,.05)}
}
function placeMarble(dt){
 frame(G.s);mPos.copy(fP).addScaledVector(fR,G.u);mPos.y+=1+G.h;marble.position.copy(mPos);
 q.setFromAxisAngle(fR,-G.v*dt);marble.quaternion.premultiply(q)}
function updateCam(dt){
 if(st==='attract'){const a=now*.35;cPos.set(mPos.x+Math.sin(a)*13,mPos.y+5,mPos.z+Math.cos(a)*13);cam3.position.lerp(cPos,1-Math.exp(-dt*3));cam3.lookAt(mPos);camFov+=(62-camFov)*.1}
 else{frame(G.s);cPos.copy(mPos).addScaledVector(fT,-13);cPos.y+=5.5;cam3.position.lerp(cPos,1-Math.exp(-dt*6));cam3.lookAt(mPos.clone().addScaledVector(fT,18).add(new THREE.Vector3(0,1,0)));
  const tf=62+10*spN+(G.nitroOn>0?22:0);camFov+=(tf-camFov)*Math.min(1,dt*4)}
 if(Math.abs(cam3.fov-camFov)>.05){cam3.fov=camFov;cam3.updateProjectionMatrix()}}
function update(dt){
 wave(now);
 if(st==='attract'){
  const p=present();
  if(!p){absentT+=dt;if(absentT>1.5)armed=true;pz.hold=null}else absentT=0;
  if(p&&armed&&pz.hold!=null){const h=now-pz.hold;$('prompt').textContent=h<2?'HOLD STEADY... '+(2-h).toFixed(1):'GET READY!';if(h>=2){A.init();startCount()}}
  else $('prompt').textContent='STEP IN FRONT OF CAMERA TO PLAY'}
 else if(st==='count'){sT+=dt;G.base=pz.raw;const n=Math.floor(sT);
  if(n!==cn){cn=n;if(n<3){pop($('count'),3-n);A.beep(false)}else{pop($('count'),'GO!');A.beep(true);setState('race');G.base=pz.raw}}
  if(present())lastSeen=now}
 else if(st==='finish'){const cc=$('card').className;
  if(phPhase==='sn'){phT+=dt;const n=Math.ceil(3-phT);if(phT>=3){drawPhoto(0);phPhase=null;$('card').className='m-res';fT_=0;const f=$('flash');f.classList.remove('pop');void f.offsetWidth;f.classList.add('pop');A.sw(2500,7000,.15,.35)}else{if(n!==phLast){phLast=n;A.beep(false)}drawPhoto(n)}}
  else{fT_+=dt;
   if(cc==='m-rec'){if(fT_>45)submit()}
   else if(cc==='m-ph'){if(fT_>20)showBoard(meIdx)}
   else if(cc==='m-res'){if(fT_>45)showBoard(meIdx)}
   else{const r=Math.max(0,20-fT_);$('cd').textContent='NEW GAME IN '+Math.ceil(r)+'s';if(r<=0)toAttract(false)}}}
 if(st==='race'||st==='cele'||st==='count')physics(dt);
 if((st==='race'||st==='count')&&now-lastSeen>15)toAttract(false);
 placeMarble(dt);updateCam(dt);
 spN=clamp(G.v/110,0,1);A.upd(spN,st==='race'||st==='cele');
 fire.update(dt,2);conf.update(dt,-18);
 // HUD
 if(st==='race'||st==='cele'||st==='count'){
  $('timer').textContent=fmt(st==='cele'?G.finT:G.t);$('cpc').textContent=Math.min(G.cp+1,10)+' / 10';
  $('spd').firstChild.nodeValue=Math.round(G.v*2.2);
  $('lean').querySelector('i').style.left=(50+G.steer*46)+'%';$('nit').firstChild.style.width=(G.nitro*100)+'%';$('nit').classList.toggle('on',G.nitroOn>0)}}
function loop(){requestAnimationFrame(loop);const n=performance.now(),dt=Math.min(.05,(n/1000-now)||.016);now=n/1000;poseStep();update(dt);renderer.render(scene,cam3)}
board=loadB();archColors(0);initCam();loop();
</script>
